<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Neural Sentiment Analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-grad-1: #0f172a;
            --bg-grad-2: #1e1b4b;
            --accent-pos: #10b981;
            --accent-neg: #ef4444;
            --accent-mixed: #f59e0b;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 40px 0;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2));
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background Orbs */
        .orb {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 10s infinite alternate ease-in-out;
            z-index: 0;
        }
        .orb-1 { top: -50px; left: -100px; background: #3b82f6; }
        .orb-2 { bottom: -50px; right: -100px; background: #8b5cf6; }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(30px) scale(1.1); }
        }

        .container {
            width: 90%;
            max-width: 650px;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.4s ease;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 5px;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            position: relative;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            color: #fff;
            font-family: inherit;
            font-size: 16px;
            resize: none;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        textarea:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.3), inset 0 2px 4px rgba(0,0,0,0.3);
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            font-family: inherit;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(59, 130, 246, 0.6);
        }

        /* Loading */
        .loader {
            display: none;
            text-align: center;
            margin-top: 20px;
            font-weight: 600;
            color: #94a3b8;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Results */
        .result-panel {
            display: none;
            margin-top: 30px;
            animation: slideUp 0.5s forwards;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid var(--glass-border);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sentiment-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .badge-pos {
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-pos);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-neg {
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-neg);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .badge-mixed {
            background: rgba(245, 158, 11, 0.2);
            color: var(--accent-mixed);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        /* Portions and Words */
        .details-section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
        }

        .section-title {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            display: block;
        }

        .word-chip {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        .chip-pos { background: rgba(16, 185, 129, 0.15); color: #4ade80; border: 1px solid rgba(16, 185, 129, 0.3); }
        .chip-neg { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        .portion-box {
            font-size: 14px;
            line-height: 1.5;
            color: #e2e8f0;
            padding-left: 10px;
            border-left: 3px solid;
            margin-bottom: 15px;
        }
        
        .portion-pos { border-left-color: var(--accent-pos); background: linear-gradient(90deg, rgba(16, 185, 129, 0.05) 0%, transparent 100%); }
        .portion-neg { border-left-color: var(--accent-neg); background: linear-gradient(90deg, rgba(239, 68, 68, 0.05) 0%, transparent 100%); }

        /* JSON Code Block */
        .json-container {
            width: 90%;
            max-width: 650px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
            display: none;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }

        pre {
            margin: 0;
            color: #a5b4fc;
            font-size: 13px;
            font-family: 'Consolas', monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="container" id="mainCard">
        <h1>Neural Sentiment</h1>
        <p class="subtitle">Deep Learning MLP with Structural VADER Analysis</p>

        <div class="input-group">
            <textarea id="inputText" placeholder="Write something contrasting... (e.g. This UI is stunning but the response is delayed)"></textarea>
        </div>

        <button onclick="analyze()" id="analyzeBtn">Analyze Sentiment</button>

        <div class="loader" id="loading">Running inference...</div>
        
        <div class="error-msg" id="errorBox"></div>

        <div class="result-panel" id="resultPanel">
            <div id="sentimentBadge" class="sentiment-badge"></div>
            
            <div style="font-weight: 600; margin-bottom: 20px;">
                Confidence: <span id="valConfidence" style="color:#60a5fa;">--</span>
            </div>

            <!-- Extracted Words -->
            <div class="details-section" id="wordsSection" style="display:none;">
                <span class="section-title">Extracted Sentiment Words</span>
                <div id="posWordsContainer"></div>
                <div id="negWordsContainer"></div>
            </div>

            <!-- Structural Portions -->
            <div class="details-section" id="portionsSection" style="display:none;">
                <span class="section-title">Structural Portions</span>
                <div class="portion-box portion-pos" id="posPortion" style="display:none;"></div>
                <div class="portion-box portion-neg" id="negPortion" style="display:none;"></div>
            </div>
            
            <div style="font-size: 13px; color: #94a3b8; margin-top: 20px; text-align: center;">
                Scroll down to see the structured JSON output.
            </div>
        </div>
    </div>
    
    <!-- Structured JSON Rendering as requested -->
    <div class="json-container" id="jsonWrap">
        <span class="section-title" style="margin-bottom: 10px; color: #cbd5e1;">Structured JSON Response</span>
        <pre id="jsonOutput"></pre>
    </div>

    <script>
        async function analyze() {
            const text = document.getElementById("inputText").value;
            const btn = document.getElementById("analyzeBtn");
            const loader = document.getElementById("loading");
            const resultPanel = document.getElementById("resultPanel");
            const jsonWrap = document.getElementById("jsonWrap");

            if (!text.trim()) {
                inputText.style.borderColor = "#ef4444";
                setTimeout(() => inputText.style.borderColor = "var(--glass-border)", 1000);
                return;
            }

            btn.style.display = "none";
            loader.style.display = "block";
            resultPanel.style.display = "none";
            jsonWrap.style.display = "none";

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({text: text})
                });

                const data = await response.json();

                loader.style.display = "none";
                btn.style.display = "block";

                if (data.error) {
                    alert(data.error);
                    return;
                }

                // Render JSON structure
                document.getElementById("jsonOutput").innerText = JSON.stringify(data, null, 2);
                jsonWrap.style.display = "block";

                // Visual Styling
                const badge = document.getElementById("sentimentBadge");
                badge.innerText = data.sentiment;
                
                let bClass = "badge-mixed";
                let borderColor = "rgba(245, 158, 11, 0.4)";
                let shadowColor = "rgba(245, 158, 11, 0.2)";

                if(data.sentiment === "Positive") { bClass = "badge-pos"; borderColor = "rgba(16, 185, 129, 0.4)"; shadowColor = "rgba(16, 185, 129, 0.2)"; }
                if(data.sentiment === "Negative") { bClass = "badge-neg"; borderColor = "rgba(239, 68, 68, 0.4)"; shadowColor = "rgba(239, 68, 68, 0.2)"; }
                
                badge.className = "sentiment-badge " + bClass;
                document.getElementById("mainCard").style.borderColor = borderColor;
                document.getElementById("mainCard").style.boxShadow = "0 25px 50px -12px " + shadowColor;

                document.getElementById("valConfidence").innerText = (data.confidence * 100).toFixed(1) + "%";

                // Words
                const pWords = data.words.positive || [];
                const nWords = data.words.negative || [];
                if(pWords.length > 0 || nWords.length > 0) {
                    document.getElementById("wordsSection").style.display = "block";
                    document.getElementById("posWordsContainer").innerHTML = pWords.map(w => `<span class="word-chip chip-pos">${w}</span>`).join("");
                    document.getElementById("negWordsContainer").innerHTML = nWords.map(w => `<span class="word-chip chip-neg">${w}</span>`).join("");
                } else {
                    document.getElementById("wordsSection").style.display = "none";
                }

                // Portions
                const portions = data.portions || {};
                const pLayer = document.getElementById("posPortion");
                const nLayer = document.getElementById("negPortion");
                pLayer.style.display = "none";
                nLayer.style.display = "none";
                
                if(portions.positive || portions.negative) {
                    document.getElementById("portionsSection").style.display = "block";
                    if(portions.positive) {
                        pLayer.style.display = "block";
                        pLayer.innerText = portions.positive;
                    }
                    if(portions.negative) {
                        nLayer.style.display = "block";
                        nLayer.innerText = portions.negative;
                    }
                } else {
                    document.getElementById("portionsSection").style.display = "none";
                }

                resultPanel.style.display = "block";

            } catch (error) {
                loader.style.display = "none";
                btn.style.display = "block";
                alert("Error connecting to server.");
            }
        }
    </script>
</body>
</html>
